# NIST SP 800-218 & OpenSSF Scorecard Hardened Deno CI Workflow
name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Minimize GITHUB_TOKEN default permissions according to least-privilege principle
permissions: {}

jobs:
  test:
    name: Quality Assurance & Automated Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        # actions/checkout v4.2.2 pinned by full commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Deno
        # denoland/setup-deno v2.0.2 pinned by full commit SHA
        uses: denoland/setup-deno@041b854f97b325bd60e53e9dc2de9cb9f9fa0c40
        with:
          deno-version: v2.x

      - name: Run Linter
        run: deno lint

      - name: Run Format Check
        run: deno fmt --check

      - name: Run Tests
        # Restrict permissions instead of full bypass (-A) to enforce least privilege
        run: deno test --allow-read --allow-env
